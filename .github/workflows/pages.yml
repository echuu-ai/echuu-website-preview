name: Deploy preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore static assets
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, shutil
          root = pathlib.Path('.')
          for item in json.loads((root / '.preview-parts/manifest.json').read_text()):
              dest = root / item['path']
              dest.parent.mkdir(parents=True, exist_ok=True)
              with dest.open('wb') as output:
                  for part in item['parts']:
                      output.write((root / part).read_bytes())
          pathlib.Path('_site').mkdir()
          for path in list(root.iterdir()):
              if path.name.startswith('.') or path.name in ['_site', 'README.md']:
                  continue
              if path.is_dir():
                  shutil.copytree(path, pathlib.Path('_site') / path.name)
              else:
                  shutil.copy2(path, pathlib.Path('_site') / path.name)
          pathlib.Path('_site/.nojekyll').touch()
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
